name: Hydromancer

description: Hydromancer is data infrastructure for the Hyperliquid ecosystem, offering real-time REST and WebSocket APIs, L2/L4 orderbook streaming,
  liquidations feeds, oracle and perp/spot price data, HIP-3/HIP-4 market events, and granular historical datasets (via its Reservoir exports).
  The REST API is a single POST /info dispatcher with Bearer-token authentication and token-metered subscription pricing; the WebSocket API delivers
  low-latency streams with tiered connection and subscription limits. Documentation is agent-native (llms.txt plus Markdown twins of every page).
  Onboarding is manual, with a discretionary free tier for public-goods and early-stage teams.

