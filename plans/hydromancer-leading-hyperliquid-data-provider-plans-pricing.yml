name: Hydromancer pricing
generated: '2026-09-21'
method: searched
source: https://docs.hydromancer.xyz/readme/pricing.md
audience: developer-api
pricing_basis: tiered-subscription
published: true
delivery:
  delivery: managed
plan_count: 4
notes: >-
  Token-metered subscription tiers. Each REST request consumes 1 token by default, with per-endpoint
  exceptions (e.g. clearinghouseState 0.025 tokens/DEX, portfolioState 0.05/DEX + 0.05 flat,
  activeAssetData/perpAnnotation 0.1 tokens). Monthly token quota per tier with per-100k-token overage.
  Some endpoints (allFills, market-data snapshots) and all-coins WebSocket firehoses are paid add-ons
  ($400 per connection for all-coins allFills/trades). Onboarding is manual (contact data@hydromancer.xyz).
  In addition to the four paid tiers below, Hydromancer runs a discretionary FREE program for public-goods
  tools and pre-revenue builder-code apps (monthly cohorts, up to 3 applications/month; charging begins
  when a builder wallet starts earning revenue) — see
  https://docs.hydromancer.xyz/readme/hydromancer-for-early-stage-teams.md
plans:
